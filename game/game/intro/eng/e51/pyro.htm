<b>名稱</b>：終極任務 (Pyrotechnica，英文版)
<b>簡介</b>：Psygnosis 1995年出品的第一人稱太空船射擊遊戲，和「<A href="descent.htm">天旋地轉（Descent）</A>」類似
      [待補]。
<IMG SRC="pyro/game1.png"> <IMG SRC="pyro/game2.png">
<b>保護</b>：無
<b>備註</b>：電腦速度不可太快，否則可能會偵測不到音效卡而當機。
<b>操作</b>：

上下左右 = 改變飛行方向
Alt = 發射主武器（綠色能量條）
Space = 發射副武器（藍色能量條）
M = 查看關卡地圖
E = 切換視角
End = 遊戲選單
