<IMG SRC="marry/game1.png">
<b>保護</b>：光碟，破解碼：
      MARRY.EXE
        B8 49 00 1E 50
        EB 16 -- -- --
      將光碟裡的所有檔案拷貝到安裝目錄，執行"subst d: ."命令後，再到D磁碟裡執行
      "MARRY.EXE D"（若模擬成光碟會無法存檔）。
<b>備註</b>：遊戲存檔會放在指定執行硬碟（MARRY.EXE參數）的MARRY目錄裡。
