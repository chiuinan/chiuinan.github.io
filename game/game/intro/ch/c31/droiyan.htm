<pre style="font-family: MingLiU, monospace; font-size: 16px;">
<b>名稱</b>：神闇世代／神暗世代 (Droiyan，中文版)
<b>簡介</b>：韓國KRG 1999年出品的策略角色扮演遊戲，由歡樂盒中文化並代理發行 [待補]。
<IMG SRC="droiyan/game1.jpg">

<IMG SRC="droiyan/game2.jpg">
<b>保護</b>：光碟，將光碟上的avi檔與MAP目錄拷貝到安裝目錄，再修改Droiyan.ini前3 byte為：
      2E 5C 00，即可免光碟（但放入光碟才有背景音樂）。
<b>限制</b>：遊戲只能在Win9x系統上安裝（但可在XP以上系統執行）。
<b>備註</b>：非安裝移機者，需修改Droiyan.ini裡的光碟路徑。
<b>備註</b>：大眾軟件雜誌附贈版的安裝內容，和歡樂盒原版完全相同。
<b>備註</b>：建議在PCem/86Box+Win9x系統上執行，否則遊戲速度會過快。
</pre>
