<b>名稱</b>：魔術轉轉球 (Rolling Marbles，中文版)
<b>簡介</b>：Tibo 1999年出品的益智遊戲，由Crystal代理發行，2001年由安峻中文化並代理發行，
      但也只是中文化安裝程序，實際遊戲內容仍為英文。遊戲規則是按下4個球的中心點以
      進行旋轉，只要將同色球以2x2（四顆）、2x3、3x2（六顆）的形式連接，即可消去 [待補]。
